<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>500 - Internal Server Error | Feane</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.css') }}" />
  
  <style>
    :root {
      --primary: #ef4444;
      --primary-hover: #dc2626;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(239, 68, 68, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow-x: hidden;
    }

    .error-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 28px;
      padding: 50px 40px;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrapper {
      width: 90px;
      height: 90px;
      background: rgba(239, 68, 68, 0.12);
      border: 2px solid rgba(239, 68, 68, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.5rem;
      color: #ef4444;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.25);
    }

    .badge-error {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -2px;
    }

    .error-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 35px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-group-custom {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-custom-primary {
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 700;
      padding: 14px 30px;
      border-radius: 45px;
      border: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none !important;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
      cursor: pointer;
    }

    .btn-custom-primary:hover {
      background-color: var(--primary-hover);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.45);
    }

    .btn-custom-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 45px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none !important;
    }

    .btn-custom-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="error-card">
    <div class="icon-wrapper">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <div class="badge-error">
      <i class="fa-solid fa-server"></i> System Malfunction
    </div>

    <div class="error-code">500</div>
    <h1 class="error-title">Internal Server Error</h1>
    <p class="error-desc">
      Something went wrong on our server while processing your request. Our technical team has been notified and is fixing it.
    </p>

    <div class="btn-group-custom">
      <button onclick="window.location.reload()" class="btn-custom-primary">
        <i class="fa-solid fa-rotate-right"></i> Refresh Page
      </button>
      <a href="/" class="btn-custom-secondary">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
    </div>
  </div>

</body>

</html>
