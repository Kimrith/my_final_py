<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>429 - Rate Limit Exceeded | Feane</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.css') }}" />
  
  <style>
    :root {
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.1) 0%, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow-x: hidden;
    }

    .error-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 28px;
      padding: 45px 35px;
      max-width: 580px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrapper {
      width: 90px;
      height: 90px;
      background: rgba(245, 158, 11, 0.12);
      border: 2px solid rgba(245, 158, 11, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.5rem;
      color: #f59e0b;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.25);
      animation: pulseGlow 2s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }
      to { transform: scale(1.06); box-shadow: 0 0 35px rgba(245, 158, 11, 0.45); }
    }

    .badge-error {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .error-code {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .error-title {
      font-size: 1.65rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 25px;
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Countdown & Progress bar */
    .timer-container {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 24px;
      margin-bottom: 30px;
    }

    .timer-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-display {
      font-weight: 700;
      color: #f59e0b;
      font-size: 1rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b 0%, #ef4444 100%);
      border-radius: 10px;
      transition: width 1s linear;
    }

    .btn-group-custom {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-custom-primary {
      background-color: var(--primary);
      color: #000000;
      font-weight: 700;
      padding: 13px 28px;
      border-radius: 45px;
      border: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none !important;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    .btn-custom-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      color: #000000;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45);
    }

    .btn-custom-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-custom-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-weight: 600;
      padding: 13px 26px;
      border-radius: 45px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none !important;
    }

    .btn-custom-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="error-card">
    <div class="icon-wrapper">
      <i class="fa-solid fa-gauge-high"></i>
    </div>

    <div class="badge-error">
      <i class="fa-solid fa-shield-halved"></i> Rate Limit Protection
    </div>

    <div class="error-code">429</div>
    <h1 class="error-title">Whoa, Slow Down!</h1>
    <p class="error-desc">
      {% if error and error.description %}
        {{ error.description }}
      {% else %}
        You've submitted too many requests in a short period of time. Please wait a moment before trying again.
      {% endif %}
    </p>

    <div class="timer-container">
      <div class="timer-label">
        <span><i class="fa-regular fa-clock"></i> Automatic Reset Cooldown</span>
        <span class="timer-display" id="timer-text">Resets in 60s</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="btn-group-custom">
      <button onclick="window.location.reload()" class="btn-custom-primary" id="retry-btn">
        <i class="fa-solid fa-rotate-right"></i> Try Again (<span id="btn-seconds">60</span>s)
      </button>
      <a href="/" class="btn-custom-secondary">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
    </div>
  </div>

  <script>
    // 60-second interactive cooldown timer
    let totalSeconds = 60;
    let remainingSeconds = totalSeconds;
    
    const timerText = document.getElementById('timer-text');
    const btnSeconds = document.getElementById('btn-seconds');
    const progressBar = document.getElementById('progress-bar');
    const retryBtn = document.getElementById('retry-btn');
    
    retryBtn.disabled = true;

    const interval = setInterval(() => {
      remainingSeconds--;
      
      const percentage = ((totalSeconds - remainingSeconds) / totalSeconds) * 100;
      progressBar.style.width = percentage + '%';

      if (remainingSeconds > 0) {
        timerText.textContent = `Resets in ${remainingSeconds}s`;
        btnSeconds.textContent = remainingSeconds;
      } else {
        clearInterval(interval);
        timerText.textContent = 'Ready!';
        timerText.style.color = '#10b981';
        retryBtn.disabled = false;
        retryBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Retry Request Now';
      }
    }, 1000);
  </script>

</body>

</html>
