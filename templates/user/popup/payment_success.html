<!-- Payment Success Popup Modal -->
<style>
  .payment-popup-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 99999;
    animation: popupFadeIn 0.3s ease;
  }

  .payment-popup-card { 
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 380px;
    padding: 35px 28px;
    text-align: center;
    position: relative;
    border: 1px solid #f1f5f9;
    animation: popupSlideUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .payment-popup-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #ecfdf5;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .payment-popup-icon-inner {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #10b981;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 8px 16px rgba(16, 185, 129, 0.35);
  }

  @keyframes popupFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes popupSlideUp {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
</style>

<div id="payment-success-popup" class="payment-popup-backdrop">
  <div class="payment-popup-card">
    <div class="payment-popup-icon">
      <div class="payment-popup-icon-inner">
        <i class="fa fa-check"></i>
      </div>
    </div>
    <h3 style="font-weight: 800; color: #1e293b; margin-bottom: 8px;">Payment Successful!</h3>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px; line-height: 1.5;">
      Your order has been received and verified. Thank you for your purchase!
    </p>
    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 18px; padding: 16px; margin-bottom: 24px;">
      <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #10b981; display: block; margin-bottom: 4px;">Amount Paid</span>
      <span style="font-size: 32px; font-weight: 800; color: #0f172a;">${{ "%.2f"|format(total_amount|float) }}</span>
    </div>
    <div class="d-flex flex-column" style="gap: 10px;">
      <a href="/" class="btn" style="background-color: #10b981; color: #ffffff; border-radius: 25px; padding: 12px; font-weight: 700; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4); text-decoration: none;">
        <i class="fa fa-home mr-1"></i> Back to Home
      </a>
      <a href="/menu" class="btn btn-outline-secondary" style="border-radius: 25px; padding: 10px; font-size: 14px; text-decoration: none;">
        <i class="fa fa-cutlery mr-1"></i> Browse Menu
      </a>
    </div>
  </div>
</div>
