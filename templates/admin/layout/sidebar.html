<aside class="w-64 bg-slate-900 text-white min-h-screen">

    <div class="p-6 border-b border-slate-700">
        <h1 class="text-2xl font-bold">
            Admin Panel
        </h1>
        {% if session.get('admin_name') %}
        <div class="mt-2 flex items-center text-xs text-emerald-400 font-semibold gap-1.5 uppercase tracking-wider">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>{{ session.get('admin_name') }}</span>
        </div>
        {% endif %}
    </div>

    <nav class="mt-4">

        <a href="{{ url_for('admin_bp.dashboard') }}" class="flex items-center px-6 py-3 hover:bg-slate-800 transition">
            <i class="bi bi-speedometer2 mr-3"></i>
            Dashboard
        </a>

        <a href="{{ url_for('admin_bp.user') }}" class="flex items-center px-6 py-3 hover:bg-slate-800 transition">
            <i class="bi bi-people mr-3"></i>
            Users
        </a>

        <a href="{{ url_for('admin_bp.product') }}" class="flex items-center px-6 py-3 hover:bg-slate-800 transition">
            <i class="bi bi-box-seam mr-3"></i>
            Products
        </a>

        <a href="{{ url_for('admin_bp.order') }}" class="flex items-center px-6 py-3 hover:bg-slate-800 transition">
            <i class="bi bi-cart mr-3"></i>
            Orders
        </a>
    </nav>

    <div class="absolute bottom-0 w-64 border-t border-slate-700">
        <a href="{{ url_for('admin_bp.logout') }}" class="flex items-center px-6 py-4 text-red-400 hover:bg-slate-800">
            <i class="bi bi-box-arrow-right mr-3"></i>
            Logout
        </a>
    </div>

</aside>
