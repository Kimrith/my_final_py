<!-- templates/components/macros.html -->

{% macro modal(id, title, form_id, cancel_url) %}
<div id="{{ id }}" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <h3 class="text-lg font-bold mb-4 text-gray-900">{{ title }}</h3>
        <!-- Content will be injected here -->
        {{ caller() }}
        <div class="flex justify-end mt-4 space-x-2">
            <a href="{{ cancel_url }}"
                class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg font-medium transition text-center inline-block">
                Cancel
            </a>
            <button type="submit" form="{{ form_id }}"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
                Confirm
            </button>
        </div>
    </div>
</div>
{% endmacro %}
